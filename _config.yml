# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Site timezone
timezone: Asia/Seoul

# jekyll-seo-tag settings
# ↓ --------------------------

title: Arpe

tagline: Undergraduate Student | Cyber Security

description: ""

# Fill in the protocol & hostname for your site.
# Do not add a trailing slash.
url: "https://arpe1618.github.io"

github:
  username: arpe1618

twitter:
  username: arpe1618

social:
  # Default author of posts and copyright owner in the footer
  name: arpe1618
  email:
  fediverse_handle:
  links:
    - https://x.com/arpe1618
    - https://github.com/arpe1618

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings


# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:


# Page views settings
pageviews:
  provider:


# Prefer color scheme setting.
#
# Empty = follow system preference.
# Users can still switch between dark and light mode.
theme_mode:


# CDN endpoint for media resources
cdn:


# Sidebar avatar
avatar:


# Site-wide social preview image
social_preview_image:


# Global switch for Table of Contents in posts
toc: true


actions:
  # Disable "Edit this post"
  edit_post:
    enabled: false
    url: ""
    static_url: false


# Comments are disabled for now.
comments:
  provider:

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:


# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:


# Progressive Web App
pwa:
  enabled: true

  cache:
    enabled: true

    deny_paths:
      # - "/example"


# Number of posts per page
paginate: 10


# The base URL of your site
baseurl: ""


# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

    span:
      line_numbers: false

    block:
      line_numbers: true
      start_line: 1


collections:
  tabs:
    output: true
    sort_by: order


defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

      # Comments disabled by default.
      comments: false

      # Display the TOC column in posts.
      toc: true

      # DO NOT modify unless you know you need a different permalink structure.
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/


sass:
  style: compressed


compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false

  ignore:
    envs: [development]


exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"


jekyll-archives:
  enabled: [categories, tags]

  layouts:
    category: category
    tag: tag

  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
